databases:
  - name: smartshelf-db
    databaseName: grocery_db
    user: sumit
    plan: free
    region: oregon

services:
  - type: web
    name: smartshelf-app
    env: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartshelf-db
          property: connectionString
      - key: SMARTSHELF_UPI_VPA
        value: farandesumit@oksbi
      - key: SMARTSHELF_MERCHANT_NAME
        value: Sumit Farande
